<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Désabonnement · Académie Sérénaissance</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<style>
  :root { --terra: #a85743; --texte: #2c221e; --doux: #7a685e; --fond: #f7f1ea; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--fond); font-family: Arial, Helvetica, sans-serif; color: var(--texte); }
  .boite { width: 100%; max-width: 460px; background: #fffbf8; border: 1px solid #e3d5c8; border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px rgba(44,34,30,.08); }
  img { width: 140px; height: auto; mix-blend-mode: darken; }
  h1 { font-family: Georgia, serif; font-size: 1.4rem; margin: 10px 0; }
  p { line-height: 1.6; color: #5a4a42; }
  a.btn { display: inline-block; margin-top: 10px; background: var(--terra); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 50px; }
</style>
</head>
<body>
<main class="boite">
  <img src="/logo.jpg" alt="Académie Sérénaissance">
  <h1 id="titre">Désabonnement…</h1>
  <p id="texte">Un instant, s'il te plaît.</p>
  <a class="btn" id="retour" href="/">Retour au site</a>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search), jeton = p.get('t') || '', en = p.get('l') === 'en';
  if (en) { document.documentElement.lang = 'en'; document.title = 'Unsubscribe · Académie Sérénaissance'; document.getElementById('retour').textContent = 'Back to the website'; document.getElementById('retour').href = '/en/'; }
  var T = en ? { ok: ['You are unsubscribed', 'You will no longer receive the Académie Sérénaissance newsletter. Thank you for following us! 💕 You can subscribe again at any time on the website.'],
                 ko: ['Invalid link', 'This unsubscribe link is not valid. Write to serenaissance.doula@gmail.com and we will remove your address right away.'] }
             : { ok: ['Tu es désabonnée', 'Tu ne recevras plus l\'infolettre de l\'Académie Sérénaissance. Merci de nous avoir suivies ! 💕 Tu peux te réabonner en tout temps sur le site.'],
                 ko: ['Lien invalide', 'Ce lien de désabonnement n\'est pas valide. Écris à serenaissance.doula@gmail.com et on retire ton adresse tout de suite.'] };
  function afficher(r) { document.getElementById('titre').textContent = r[0]; document.getElementById('texte').textContent = r[1]; }
  if (!/^[0-9a-f-]{36}$/i.test(jeton)) return afficher(T.ko);
  fetch('https://zeptirfcwstufcpgvkzx.supabase.co/rest/v1/rpc/desabonner_infolettre', {
    method: 'POST', headers: { 'apikey': 'sb_publishable_OBeZ61m6gGF5tGPUokeS_A_nCZvpdpl', 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_jeton: jeton })
  }).then(function (r) { return r.json(); }).then(function (ok) { afficher(ok === true ? T.ok : T.ko); })
    .catch(function () { afficher(en ? ['Connection problem', 'Please try again in a moment, or write to serenaissance.doula@gmail.com.'] : ['Problème de connexion', 'Réessaie dans un instant, ou écris à serenaissance.doula@gmail.com.']); });
})();
</script>
</body>
</html>
