<style>
:root{--bg-color:#f7f1ea;--text-dark:#2c221e;--text-muted:#7a685e;--accent-terracotta:#a85743;--terra-dark:#8e4634;--card-bg:#fffbf8;--border-color:#e3d5c8;--tint:#efe6dc}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg-color);color:var(--text-dark);line-height:1.65;overflow-x:hidden;overflow-wrap:break-word}
img{max-width:100%;height:auto;display:block}
a{color:var(--terra-dark)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent-terracotta);outline-offset:3px;border-radius:6px}
.saut{position:absolute;left:-9999px;top:0;background:var(--accent-terracotta);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;z-index:100}
.saut:focus{left:0}
.enveloppe{max-width:1100px;margin:0 auto;padding:0 16px}
header.entete{background:var(--bg-color);border-bottom:1px solid var(--border-color)}
.entete .enveloppe{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.entete .logo img{height:58px;width:auto;mix-blend-mode:darken}
.entete nav ul{display:flex;align-items:center;gap:6px 18px;list-style:none;font-size:.92rem;font-weight:500}
.entete nav a{color:var(--text-dark);text-decoration:none;padding:8px 0;display:inline-block}
.entete nav a:hover{color:var(--accent-terracotta)}
.entete nav a.langue{font-weight:700;font-size:.8rem;letter-spacing:.04em;border:1px solid var(--border-color);border-radius:50px;padding:6px 12px}
main{padding:34px 0 20px;min-height:55vh}
#blogue-app{max-width:1100px;margin:0 auto;padding:0 16px}
.sb-h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.15;text-align:center;margin-bottom:10px}
.sb-intro{text-align:center;color:#666;max-width:640px;margin:0 auto 30px;font-size:1.02rem}
.sb-centre{text-align:center;margin-bottom:14px;color:#666}
.sb-article{max-width:740px;margin:0 auto}
.sb-retour{margin-bottom:18px;font-size:.92rem;font-weight:600}
.sb-retour a{text-decoration:none}
.sb-retour a:hover{text-decoration:underline}
.sb-h1-article{text-align:left;font-size:clamp(1.7rem,5vw,2.5rem);margin-bottom:12px}
.sb-article .sb-date{font-size:.88rem;font-weight:600;color:var(--text-muted);margin-bottom:20px}
.sb-image{width:100%;max-height:440px;object-fit:cover;border-radius:20px;border:1px solid var(--border-color);margin:0 0 28px;background:var(--tint)}
.sb-avis{margin:34px 0 0;background:var(--tint);border-left:4px solid var(--accent-terracotta);border-radius:0 14px 14px 0;padding:14px 18px;font-size:.92rem;color:#4a3c35}
.sb-autres{margin-top:54px;padding-top:30px;border-top:1px solid var(--border-color)}
.sb-h2{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;text-align:center;margin-bottom:22px}
footer.pied{background:#2c221e;color:#f3e9e0;margin-top:50px;padding:30px 0 24px;font-size:.9rem;text-align:center}
.pied a{color:#f6d9cc}
.pied p{margin-bottom:8px}
.pied .liens{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;list-style:none;margin-bottom:14px}
.pied .legal{border-top:1px solid #4a3c35;padding-top:14px;font-size:.82rem;color:#d9c9bd;margin-top:6px}
@media(max-width:520px){.entete .logo img{height:46px}.entete nav ul{gap:4px 12px;font-size:.86rem}.entete .nav-formations{display:none}}
</style>
</head>
