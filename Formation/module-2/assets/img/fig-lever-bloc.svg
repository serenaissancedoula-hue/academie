.5" font-weight="600" fill="#2c2622" text-anchor="middle">les bras</text><path d="M450 105 l10 0 m-5 -6 l6 6 l-6 6" stroke="#5f8570" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="464" y="30" width="130" height="150" rx="18" fill="#e7f0ea"/><circle cx="529" cy="70" r="22" fill="#5f8570"/><text x="529" y="77" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="529" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2c2622" text-anchor="middle">Rester assise</text><text x="529" y="146" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2c2622" text-anchor="middle">quelques secondes</text><path d="M598 105 l10 0 m-5 -6 l6 6 l-6 6" stroke="#5f8570" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="612" y="30" width="130" height="150" rx="18" fill="#e7f0ea"/><circle cx="677" cy="70" r="22" fill="#5f8570"/><text x="677" y="77" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="677" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2c2622" text-anchor="middle">Se lever</text><text x="677" y="146" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#2c2622" text-anchor="middle">en expirant</text><text x="380" y="212" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#7a6f66" text-anchor="middle">Pour se coucher, on fait l'inverse.</text></svg>