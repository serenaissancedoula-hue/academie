<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320"><rect width="760" height="330" fill="#fff"/><rect x="20" y="16" width="720" height="64" rx="16" fill="#e7f0ea"/><rect x="20" y="16" width="10" height="64" rx="5" fill="#5f8570"/><text x="50" y="44" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#5f8570" text-anchor="start">Soins permis dans le cadre de sa formation</text><text x="50" y="65" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#4a423c" text-anchor="start">Oui, avec consentement explicite</text><rect x="20" y="92" width="720" height="64" rx="16" fill="#e2edf3"/><rect x="20" y="92" width="10" height="64" rx="5" fill="#6f96b0"/><text x="50" y="120" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6f96b0" text-anchor="start">Soins que la mère fait elle-même, après enseignement</text><text x="50" y="141" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#4a423c" text-anchor="start">L'accompagnante rappelle les consignes</text><rect x="20" y="168" width="720" height="64" rx="16" fill="#fdeede"/><rect x="20" y="168" width="10" height="64" rx="5" fill="#c26a1e"/><text x="50" y="196" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#c26a1e" text-anchor="start">Soins réservés aux professionnelles de santé</text><text x="50" y="217" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#4a423c" text-anchor="start">Non ; orientation</text><rect x="20" y="244" width="720" height="64" rx="16" fill="#fbe7e5"/><rect x="20" y="244" width="10" height="64" rx="5" fill="#b23b3b"/><text x="50" y="272" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#b23b3b" text-anchor="start">Pratiques déconseillées pour tous</text><text x="50" y="293" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#4a423c" text-anchor="start">Informer des risques, ne pas proposer</text></svg>