<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270"><rect width="760" height="270" fill="#fff"/><rect x="20" y="10" width="350" height="250" rx="22" fill="#e2edf3"/><text x="46" y="54" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#6f96b0">France</text><text x="46" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4a423c" text-anchor="start">Contrat conclu hors établissement</text><rect x="42" y="104" width="306" height="60" rx="14" fill="#fff"/><text x="60" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#6f96b0" text-anchor="start">14 jours</text><text x="180" y="131" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#4a423c" text-anchor="start">de rétractation</text><text x="180" y="149" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#4a423c" text-anchor="start">sans motif</text><rect x="42" y="178" width="306" height="60" rx="14" fill="#fff"/><text x="60" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#6f96b0" text-anchor="start">7 jours</text><text x="180" y="205" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#4a423c" text-anchor="start">avant tout paiement</text><text x="180" y="223" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#4a423c" text-anchor="start">(sauf exceptions)</text><rect x="390" y="10" width="350" height="250" rx="22" fill="#f6e7df"/><text x="416" y="54" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#b4654a">Québec</text><text x="416" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4a423c" text-anchor="start">Commerce itinérant (si le régime s'applique)</text><rect x="412" y="104" width="306" height="60" rx="14" fill="#fff"/><text x="430" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b4654a" text-anchor="start">10 jours</text><text x="550" y="131" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#4a423c" text-anchor="start">pour résoudre</text><text x="550" y="149" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#4a423c" text-anchor="start">le contrat</text><rect x="412" y="178" width="306" height="60" rx="14" fill="#fff"/><text x="430" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b4654a" text-anchor="start">15 jours</text><text x="550" y="205" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#4a423c" text-anchor="start">pour rembourser</text><text x="550" y="223" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#4a423c" text-anchor="start">après résolution</text></svg>