<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230"><rect width="760" height="230" fill="#fff"/><rect x="14" y="24" width="114" height="170" rx="18" fill="#e7f0ea"/><circle cx="71" cy="66" r="22" fill="#5f8570"/><text x="71" y="73" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="71" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">Ce qui s'est</text><text x="71" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">passé (faits)</text><rect x="138" y="24" width="114" height="170" rx="18" fill="#e7f0ea"/><circle cx="195" cy="66" r="22" fill="#5f8570"/><text x="195" y="73" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="195" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">Ce que</text><text x="195" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">j'ai fait</text><rect x="262" y="24" width="114" height="170" rx="18" fill="#e7f0ea"/><circle cx="319" cy="66" r="22" fill="#5f8570"/><text x="319" y="73" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="319" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">Ce que</text><text x="319" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">j'ai ressenti</text><rect x="386" y="24" width="114" height="170" rx="18" fill="#e7f0ea"/><circle cx="443" cy="66" r="22" fill="#5f8570"/><text x="443" y="73" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="443" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">Ce qui me</text><text x="443" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">questionne</text><rect x="510" y="24" width="114" height="170" rx="18" fill="#e7f0ea"/><circle cx="567" cy="66" r="22" fill="#5f8570"/><text x="567" y="73" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="567" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">Ce que je pourrais</text><text x="567" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">faire autrement</text><rect x="634" y="24" width="114" height="170" rx="18" fill="#e7f0ea"/><circle cx="691" cy="66" r="22" fill="#5f8570"/><text x="691" y="73" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="691" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">Ce que</text><text x="691" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2622" text-anchor="middle">je retiens</text><text x="380" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#7a6f66" text-anchor="middle">Situations présentées de façon anonymisée.</text></svg>