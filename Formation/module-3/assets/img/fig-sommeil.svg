<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330"><rect width="760" height="330" fill="#fff"/><rect x="250" y="80" width="260" height="140" rx="14" fill="none" stroke="#7d6aa8" stroke-width="5"/><line x1="280" y1="84" x2="280" y2="176" stroke="#7d6aa8" stroke-width="3.5" opacity=".5"/><line x1="308" y1="84" x2="308" y2="176" stroke="#7d6aa8" stroke-width="3.5" opacity=".5"/><line x1="336" y1="84" x2="336" y2="176" stroke="#7d6aa8" stroke-width="3.5" opacity=".5"/><line x1="364" y1="84" x2="364" y2="176" stroke="#7d6aa8" stroke-width="3.5" opacity=".5"/><line x1="392" y1="84" x2="392" y2="176" stroke="#7d6aa8" stroke-width="3.5" opacity=".5"/><line x1="420" y1="84" x2="420" y2="176" stroke="#7d6aa8" stroke-width="3.5" opacity=".5"/><line x1="448" y1="84" x2="448" y2="176" stroke="#7d6aa8" stroke-width="3.5" opacity=".5"/><line x1="476" y1="84" x2="476" y2="176" stroke="#7d6aa8" stroke-width="3.5" opacity=".5"/><rect x="256" y="176" width="248" height="18" rx="5" fill="#ebe7f4" stroke="#7d6aa8" stroke-width="2.5"/><ellipse cx="380" cy="168" rx="46" ry="12" fill="#e2edf3" stroke="#6f96b0" stroke-width="2.5"/><circle cx="326" cy="166" r="12" fill="#f3d2c2"/><text x="40" y="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7d6aa8" text-anchor="start">Sur le dos, à chaque sommeil</text><text x="40" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7d6aa8" text-anchor="start">Dans son propre lit</text><text x="40" y="240" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#7d6aa8" text-anchor="start">Matelas ferme, rien dans le lit</text><text x="720" y="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#b4654a" text-anchor="end">Chambre des parents</text><text x="720" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#7a6f66" text-anchor="end">au moins 6 mois</text><text x="720" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#b4654a" text-anchor="end">Sans fumée</text><text x="720" y="240" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#b4654a" text-anchor="end">Sans surchauffe</text><text x="720" y="260" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#7a6f66" text-anchor="end">chambre tempérée, pas de bonnet</text><rect x="170" y="280" width="420" height="40" rx="20" fill="#fbe7e5"/><text x="380" y="306" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#b23b3b" text-anchor="middle">Jamais sur un canapé ni dans un fauteuil</text></svg>